<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Guardian{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & tokens ────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #07101E;
      --surface:     #0D1B2E;
      --surface-2:   #112234;
      --border:      rgba(0,194,255,.10);
      --border-h:    rgba(0,194,255,.28);
      --accent:      #00C2FF;
      --accent-dim:  rgba(0,194,255,.12);
      --green:       #00E676;
      --green-dim:   rgba(0,230,118,.12);
      --red:         #FF4569;
      --red-dim:     rgba(255,69,105,.12);
      --amber:       #FFB74D;
      --amber-dim:   rgba(255,183,77,.12);
      --text:        #C8D8E8;
      --text-dim:    #4E6A85;
      --text-hi:     #E8F4FD;
      --radius:      14px;
      --radius-sm:   8px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Nav ───────────────────────────────────────────────────── */
    nav {
      position: sticky; top: 0; z-index: 100;
      height: 62px;
      background: rgba(7,16,30,.93);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex; align-items: center; gap: 1rem;
    }

    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; flex-shrink: 0;
    }

    .nav-eye {
      width: 30px; height: 30px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00E8FF 0%, #0070A0 60%, #003550 100%);
      box-shadow: 0 0 14px rgba(0,194,255,.55);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .nav-eye::after {
      content:''; width: 9px; height: 9px;
      background: #07101E; border-radius: 50%;
    }

    .nav-brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem; font-weight: 700;
      color: var(--text-hi); letter-spacing: -.02em;
    }
    .nav-brand-name span { color: var(--accent); }

    .nav-links {
      display: flex; align-items: center; gap: 2px; margin-left: .5rem;
    }

    .nav-link {
      text-decoration: none; color: var(--text-dim);
      font-size: .85rem; font-weight: 500;
      padding: 6px 13px; border-radius: var(--radius-sm);
      transition: all .18s;
    }
    .nav-link:hover { color: var(--text-hi); background: var(--accent-dim); }
    .nav-link.active { color: var(--accent); background: var(--accent-dim); }

    .nav-spacer { flex: 1; }

    .nav-actions { display: flex; align-items: center; gap: 6px; }

    /* ── Buttons ────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: 'Inter', sans-serif;
      font-size: .85rem; font-weight: 500;
      padding: 7px 15px; border-radius: var(--radius-sm);
      border: none; cursor: pointer;
      transition: all .18s; text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary { background: var(--accent); color: #07101E; }
    .btn-primary:hover { background: #1DD3FF; transform: translateY(-1px); }

    .btn-danger {
      background: var(--red-dim); color: var(--red);
      border: 1px solid rgba(255,69,105,.25);
    }
    .btn-danger:hover { background: rgba(255,69,105,.22); }

    .btn-success {
      background: var(--green-dim); color: var(--green);
      border: 1px solid rgba(0,230,118,.25);
    }
    .btn-success:hover { background: rgba(0,230,118,.22); }

    .btn-ghost {
      background: transparent; color: var(--text-dim);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--border-h); color: var(--text); }

    /* ── Cards ──────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    /* ── Badges ─────────────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: .72rem; font-weight: 600;
      padding: 3px 9px; border-radius: 20px;
      letter-spacing: .03em;
    }
    .badge-green  { background: var(--green-dim);  color: var(--green);  }
    .badge-red    { background: var(--red-dim);    color: var(--red);    }
    .badge-amber  { background: var(--amber-dim);  color: var(--amber);  }
    .badge-blue   { background: var(--accent-dim); color: var(--accent); }
    .badge-muted  { background: rgba(78,106,133,.12); color: var(--text-dim); }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    /* ── Layout ─────────────────────────────────────────────────── */
    .container { max-width: 1180px; margin: 0 auto; padding: 2rem; }

    /* ── Section title ──────────────────────────────────────────── */
    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: .95rem; font-weight: 600;
      color: var(--text-hi); margin-bottom: 1rem;
    }

    /* ── Modal ──────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(4,9,18,.85); backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 2rem;
      width: 490px; max-width: 95vw;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.2rem; font-weight: 700;
      color: var(--text-hi); margin-bottom: 1.5rem;
    }
    .modal-footer {
      display: flex; justify-content: flex-end; gap: 8px; margin-top: 1.5rem;
    }

    /* ── Forms ──────────────────────────────────────────────────── */
    .form-group  { margin-bottom: 1.2rem; }
    .form-label  {
      display: block; font-size: .77rem; font-weight: 600;
      color: var(--text-dim); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: .06em;
    }
    .form-input  {
      width: 100%;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 14px;
      color: var(--text-hi); font-family: 'Inter', sans-serif;
      font-size: .9rem; outline: none; transition: border-color .18s;
    }
    .form-input:focus { border-color: var(--accent); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .days-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    }
    .day-toggle {
      aspect-ratio: 1; border-radius: 7px;
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text-dim); font-size: .7rem; font-weight: 600;
      cursor: pointer; transition: all .18s;
      display: flex; align-items: center; justify-content: center;
    }
    .day-toggle.active {
      background: var(--accent-dim); border-color: var(--accent); color: var(--accent);
    }

    /* ── Toast ──────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 20px;
      font-size: .875rem; display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
      transition: opacity .2s;
    }

    /* ── Scrollbar ──────────────────────────────────────────────── */
    ::-webkit-scrollbar              { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track        { background: transparent; }
    ::-webkit-scrollbar-thumb        { background: var(--border); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover  { background: var(--border-h); }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">
    <div class="nav-eye"></div>
    <span class="nav-brand-name">Guard<span>ian</span></span>
  </a>

  <div class="nav-links">
    <a href="/"     class="nav-link {% if request.endpoint=='index'      %}active{% endif %}">Overview</a>
    <a href="/logs" class="nav-link {% if request.endpoint=='logs_page'  %}active{% endif %}">Logs</a>
  </div>

  <div class="nav-spacer"></div>

  <div class="nav-actions">
    <button class="btn btn-success" onclick="emergencyAll(false)">🟢 Allow All</button>
    <button class="btn btn-danger"  onclick="emergencyAll(true)">🔴 Block All</button>
  </div>
</nav>

<main>{% block content %}{% endblock %}</main>

<div id="toast"></div>

<script>
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    t.style.borderColor =
      type==='error'   ? 'rgba(255,69,105,.4)'  :
      type==='success' ? 'rgba(0,230,118,.4)'   :
                         'rgba(0,194,255,.25)';
    t.style.color =
      type==='error'   ? 'var(--red)'   :
      type==='success' ? 'var(--green)' :
                         'var(--text)';
    clearTimeout(t._tid);
    t._tid = setTimeout(()=>{ t.style.display='none'; }, 3000);
  }

  async function emergencyAll(block) {
    const r = await fetch('/api/emergency-all', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({blocked:block})
    });
    if (r.ok) {
      showToast(
        block ? '🔴 All students blocked' : '🟢 All students unblocked',
        block ? 'error' : 'success'
      );
      setTimeout(()=>location.reload(), 1100);
    }
  }

  {% block scripts %}{% endblock %}
</script>
</body>
</html>
